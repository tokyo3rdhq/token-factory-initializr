name: Fetch Free Models

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:


# Least-privilege: this workflow only reads repo contents
# (actions/checkout, npm ci / pip install). It does not write
# PR comments, releases, or pushes. Declaring contents: read
# explicitly prevents accidental token-scope expansion if a
# future contributor adds a write-capable action without
# resetting the workflow permissions.
permissions:
  contents: read
jobs:
  fetch-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — SHA-pinned per security audit F2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0 — SHA-pinned per security audit F2
        with:
          python-version: "3.11"

      # Production install: only the runtime dependencies declared in
      # [project.dependencies] (currently just `requests`). Dev extras
      # (pytest, hypothesis, ruff, ...) are NOT installed here — those
      # belong on a separate PR-time CI workflow that runs against every
      # push, not on the deployed data ingestion job.
      - name: Install runtime dependencies
        run: |
          pip install --upgrade pip
          pip install ./data

      - name: Fetch models
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          # Optional: Feishu webhook for failure alerts.
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          cd data
          python main.py

      - name: Validate results
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          # Confirm the pipeline actually wrote today's manifest to KV. We
          # use the dated key (tfi:manifest:YYYY-MM-DD) instead of
          # tfi:manifest:latest because the latter could still hold a previous
          # run's data if the current run failed silently.
          #
          # The KV GET endpoint requires a Bearer token (Cloudflare API v4).
          # Earlier versions of this step called urlopen without auth and
          # got HTTP 401 on every run, masking the real status. The
          # trailing-newline strip mirrors the same guard used in the
          # Fetch models step above and the Pages deploy workflow.
          cd data
          python -c "
          import os, sys, urllib.request, urllib.error, json
          from datetime import datetime, timezone
          account = os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token = os.environ['CLOUDFLARE_API_TOKEN'].strip()
          ns = os.environ['CLOUDFLARE_KV_NAMESPACE_ID'].strip()
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          dated_key = f'tfi:manifest:{today}'
          url = f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{ns}/values/{dated_key}'
          req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  manifest = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print(f'::error::{dated_key} not found in KV (404)')
                  sys.exit(1)
              if e.code == 401:
                  print('::error::KV GET returned 401 — CLOUDFLARE_API_TOKEN missing or lacks read scope')
                  sys.exit(1)
              raise
          total = manifest.get('total', 0)
          providers = manifest.get('providers', {})
          failed = [name for name, info in providers.items() if info.get('status') == 'failed']
          print(f\"{dated_key} -> total={total} providers={list(providers.keys())} failed={failed}\")
          if total == 0:
              print('::error::manifest reports zero endpoints — pipeline likely produced nothing')
              sys.exit(1)
          if failed:
              print(f'::warning::providers with status=failed: {failed}')
          "
