name: Data CI (lint + test)

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - ".github/workflows/data-ci.yml"
  workflow_dispatch:

# Cancel in-progress runs on the same ref so a fast follow-up
# commit doesn't queue behind a slow previous one.
concurrency:
  group: data-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dev extras so pytest and ruff are available.
      # CI does NOT have the CLOUDFLARE_* secrets that fetch-models.yml
      # has, so we cannot run integration tests here. The `-m "not
      # integration"` selector below skips anything marked
      # @pytest.mark.integration via the autouse skip_integration
      # fixture in tests/conftest.py.
      - name: Install production + dev dependencies
        working-directory: data
        run: pip install -e ".[dev]"

      - name: Run tests (unit only)
        working-directory: data
        run: pytest -m "not integration"