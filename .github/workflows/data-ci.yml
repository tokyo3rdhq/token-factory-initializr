name: Data CI (lint + test)

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - ".github/workflows/data-ci.yml"
  workflow_dispatch:

# Cancel in-progress runs on the same ref so a fast follow-up
# commit doesn't queue behind a slow previous one.
concurrency:
  group: data-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dev extras so pytest and ruff are available.
      # These are runtime-only for fetch-models.yml (which uses pip install ./data),
      # but CI needs them for the lint + test steps.
      - name: Install production + dev dependencies
        working-directory: data
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: data
        run: pytest