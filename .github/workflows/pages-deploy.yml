name: web CI (lint + test + build)

# Web-only CI: runs lint + tests + a production build to catch
# regressions on every push to main. Does NOT deploy — production
# releases go through wrangler pages deploy from a developer
# machine that holds the Cloudflare Pages deploy token in its
# local .env (see web/.env.example). Keeping deploy out of CI
# avoids leaking the token into the GitHub Actions secret store
# (the upstream private mirror doesn't need its own deploy key).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

# Cancel in-progress runs on the same ref so a fast follow-up
# commit doesn't queue behind a slow previous one.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install npm dependencies
        working-directory: web
        # ``--include=dev`` because the test + build steps need
        # devDependencies (tsx, vite, typescript, wrangler). The
        # default ``npm ci`` honors the ``production`` lockfile
        # setting (which some package-lock.json files set to true),
        # which would skip devDependencies and break the build.
        run: npm ci --include=dev

      - name: TypeScript type-check (tsc --noEmit)
        working-directory: web
        # Vite's build already runs tsc, but an isolated run surfaces
        # type errors in the PR before we burn npm time on a build we
        # will then throw away.
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: web
        # tsx --test runner; 250+ across 8 test files. Catches
        # generator / projection / filter regressions before they
        # reach Cloudflare.
        run: npm test

      - name: Build the production bundle
        working-directory: web
        # Mirrors the local build path: tsc --noEmit && vite build.
        # Verifies the bundle actually compiles end-to-end (not just
        # the type-checker + the test runner separately).
        run: npm run build