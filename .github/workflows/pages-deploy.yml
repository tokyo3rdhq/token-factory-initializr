name: Deploy web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      - name: Build the React + Pages Functions bundle
        working-directory: web
        # Vite outputs to ./dist; ``pages_build_output_dir`` in
        # wrangler.toml points there so wrangler pages deploy picks
        # up both the static assets and the Functions directory.
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          # Strip whitespace from secrets. Cloudflare IDs / tokens are
          # hex/alphanumeric with no legitimate whitespace. A trailing
          # newline occasionally sneaks in when secrets are pasted into
          # GitHub's secret UI textarea, which then breaks wrangler's
          # strict alphanumeric validation.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_ACCOUNT_ID=$(echo -n "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          CLOUDFLARE_API_TOKEN=$(echo -n "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          export CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN
          npx wrangler pages deploy ./dist \
            --project-name token-factory-initializr \
            --branch main \
            --commit-message "ci: deploy web via github actions"