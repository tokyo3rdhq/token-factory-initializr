[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-factory-initializr-data"
version = "0.1.0"
description = "Open Model Intelligence and Supply Layer that turns provider model data into user-oriented AI model stacks."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MAGI / tokyo3rdhq" }]
keywords = ["ai", "model-catalog", "litellm", "bifrost", "newapi", "cloudflare-pages"]

dependencies = [
    "requests>=2.31",       # NVIDIA fetcher (data/providers/nvidia.py)
    # AMD + HF providers use stdlib urllib only.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "hypothesis>=6.92",
    "requests-mock>=1.12",
]
socks = ["PySocks>=1.7"]   # local-dev SOCKS5 proxy for the HF provider

[project.urls]
Repository = "https://github.com/tokyo3rdhq/token-factory-initializr"
Issues = "https://github.com/tokyo3rdhq/token-factory-initializr/issues"
Changelog = "https://github.com/tokyo3rdhq/token-factory-initializr/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--timeout=30",
    "--tb=short",
]
markers = [
    "unit: marks tests as unit tests (fast, no network)",
    "integration: marks tests as integration tests (may hit network)",
    "slow: marks tests as slow (>5s)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]
exclude = [".venv", "__pycache__", ".pytest_cache", "dist", "build"]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W", "ARG"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.setuptools.packages.find]
where = [".."]
include = ["data", "data.*"]
exclude = ["data.tests*"]
